# PoolGuard (Base Sepolia) and PoolReflex (Reactive Lasna). A separate Foundry project from reactive/: the Reactive
# library needs solc ^0.8.29, while the test pool's hook stays on 0.8.26 so its deployed bytecode can be rebuilt.
[profile.default]
src = "src"
test = "test"
script = "script"
out = "out"
libs = ["lib"]
solc_version = "0.8.30"
evm_version = "cancun"
optimizer = true
optimizer_runs = 200
bytecode_hash = "none"
fs_permissions = [{ access = "read", path = "../deployments" }]

[fuzz]
runs = 512

[rpc_endpoints]
base_sepolia = "https://sepolia.base.org"
lasna = "https://lasna-rpc.rnk.dev/"

[lint]
lint_on_build = false

# Fork tests run against Base Sepolia (public RPC). Run: FOUNDRY_PROFILE=fork forge test
[profile.fork]
test = "test-fork"

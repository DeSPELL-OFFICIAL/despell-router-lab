[profile.default]
src = "src"
test = "test"
script = "script"
out = "out"
libs = ["lib"]
solc_version = "0.8.26"
evm_version = "cancun"
optimizer = true
optimizer_runs = 200
# No metadata hash, so the creation code (and the mined CREATE2 hook address) is the same on every machine.
bytecode_hash = "none"
fs_permissions = [{ access = "read", path = "./deployments" }]

[fuzz]
runs = 512

[rpc_endpoints]
base_sepolia = "https://sepolia.base.org"
sepolia = "https://ethereum-sepolia-rpc.publicnode.com"

[lint]
lint_on_build = false

# Fork tests run the real scripts against Base Sepolia (public RPC). They need the network, so they are
# not part of the default `forge test`. Run: FOUNDRY_PROFILE=fork forge test
[profile.fork]
test = "test-fork"

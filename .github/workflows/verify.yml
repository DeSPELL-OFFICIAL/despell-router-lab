name: verify

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # gitleaks reads the commits of this PR or push

      # gitleaks backs up scripts/check-secrets.mjs with a maintained rule set.
      # The CLI from the public release is pinned by version and sha256
      # (gitleaks-action would need a licence key for an organisation repo).
      - name: Install gitleaks
        env:
          GITLEAKS_VERSION: 8.30.1
          GITLEAKS_TARBALL_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
        run: |
          curl -sSfL -o "$RUNNER_TEMP/gitleaks.tar.gz" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_TARBALL_SHA256}  $RUNNER_TEMP/gitleaks.tar.gz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/gitleaks.tar.gz" -C "$RUNNER_TEMP" gitleaks
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"

      - name: Scan new commits with gitleaks
        env:
          BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
          HEAD: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        # A range git cannot resolve would make gitleaks scan nothing and still
        # pass, so a missing commit fails the job instead.
        run: |
          set -euo pipefail
          if ! git rev-parse --verify --quiet "${HEAD}^{commit}" > /dev/null; then
            echo "::error::gitleaks: head commit '${HEAD}' is not in this checkout"
            exit 1
          fi
          if [ -z "$BASE" ] || [ "$BASE" = "0000000000000000000000000000000000000000" ]; then
            # A brand-new branch has no before commit: scan everything it holds.
            range="$HEAD"
          elif git rev-parse --verify --quiet "${BASE}^{commit}" > /dev/null; then
            range="$BASE..$HEAD"
          else
            echo "::error::gitleaks: base commit '${BASE}' is not in this checkout (force-push or shallow clone?)"
            exit 1
          fi
          echo "gitleaks range: $range"
          gitleaks git --no-banner --redact --log-opts="$range" .

      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm verify

      # Contract folders. Foundry is pinned; each folder adds its own steps below.
      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: v1.5.1

      - name: Cache reactive dependencies
        uses: actions/cache@v4
        with:
          path: reactive/lib
          key: reactive-lib-${{ hashFiles('reactive/scripts/install-deps.sh') }}
      - name: reactive · dependencies (pinned in install-deps.sh)
        run: reactive/scripts/install-deps.sh
      - name: reactive · forge fmt
        working-directory: reactive
        run: forge fmt --check src script test test-fork
      # Unit tests only. The fork tests (FOUNDRY_PROFILE=fork) need a live Base Sepolia RPC.
      - name: reactive · forge test
        working-directory: reactive
        run: forge test
